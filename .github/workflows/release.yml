name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: Validate release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@12.0.2
      - run: npm ci --no-audit --no-fund
      - name: Validate release tag
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
      - run: npm run check
      - name: Verify committed Action bundle
        run: |
          git ls-files --error-unmatch dist/action/index.cjs
          git diff --exit-code -- dist/action/index.cjs
      - name: Create npm artifact
        run: |
          mkdir release-artifacts
          npm pack --json --pack-destination release-artifacts
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  npm:
    name: Publish npm package
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "operational-aibom@$VERSION" version --json >/dev/null 2>&1; then
            echo "operational-aibom@$VERSION is already published"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          npm publish ./release-artifacts/*.tgz \
            --access public \
            --provenance \
            --tag "$DIST_TAG"

  github:
    name: Create GitHub release
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ARGS=(
            release create "$GITHUB_REF_NAME"
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "Operational AIBOM $VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi
          gh "${RELEASE_ARGS[@]}"
